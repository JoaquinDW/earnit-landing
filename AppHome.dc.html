<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" />
  <style>
    body { margin: 0; background: #070E0D; font-family: Figtree, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #6E97FF; text-decoration: none; }
    a:hover { color: #4674FF; }
    .serif { font-family: 'Instrument Serif', 'Times New Roman', Times, serif; font-weight: 400; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: #070E0D; color: #ECF3EE; overflow: hidden;">
  <img src="home-evening.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center bottom; display: block;" />
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,14,13,0.92) 0%, rgba(7,14,13,0.78) 26%, rgba(7,14,13,0.42) 56%, rgba(7,14,13,0.10) 76%, rgba(7,14,13,0.34) 100%);"></div>

  <div style="position: relative; display: flex; flex-direction: column; padding: 62px 28px 0;">

    <div style="display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; font-weight: 500; color: #93A79D;">
      <div style="flex: 1 1 0;">Wednesday</div>
      <div class="serif" style="font-size: 21px; color: #ECF3EE;">Earnit</div>
      <div style="flex: 1 1 0; text-align: right;">3-day streak</div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: 16px;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 1.9px; text-transform: uppercase; color: #93A79D;">Available time</div>

      <div style="display: flex; align-items: last baseline; gap: 8px; margin-top: 10px;">
        <div class="serif" style="font-size: 112px; line-height: 0.9; color: #ECF3EE;">10</div>
        <div style="font-size: 19px; color: #93A79D;">min</div>
      </div>

      <div style="font-size: 14px; color: #93A79D; margin-top: 6px;">to spend on your apps</div>

      <div style="display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 28px; min-height: 44px; box-sizing: border-box; padding: 13px 20px; border-radius: 999px; background: #2E5CE6; color: #FFFFFF; font-size: 15px; font-weight: 600; box-shadow: 0 8px 18px -4px rgba(46,92,230,0.42);">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        <div>Earn more time</div>
      </div>

      <div style="font-size: 13px; color: #61756B; margin-top: 16px;">1,000 steps until your next 5 minutes</div>
      <div style="font-size: 12px; color: #4E6159; margin-top: 6px; min-height: 30px;">2,000 steps today · <span style="color: #8CBF6B;">+10 min earned today</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 24px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px;">
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 1.9px; text-transform: uppercase; color: #93A79D;">Ready to spend</div>
        <div style="font-size: 13px; font-weight: 500; color: #6E97FF;">Edit</div>
      </div>

      <div style="height: 1px; background: rgba(236,243,238,0.07);"></div>

      <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 4px;">
        <div style="width: 42px; height: 42px; border-radius: 12px; background: #1B2A24; display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B9CCC2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.2" cy="6.8" r="1" fill="#B9CCC2" stroke="none"></circle></svg>
        </div>
        <div style="width: 42px; height: 42px; border-radius: 12px; background: #1B2A24; display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B9CCC2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6.5a4.5 4.5 0 0 0 5 4"></path><circle cx="6.4" cy="17.6" r="2.6"></circle></svg>
        </div>
        <div style="width: 42px; height: 42px; border-radius: 12px; background: #1B2A24; display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9CCC2" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l16 16M20 4L4 20"></path></svg>
        </div>
        <div style="flex-grow: 1;"></div>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#4E6159" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
      </div>

      <div style="height: 1px; background: rgba(236,243,238,0.07);"></div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
